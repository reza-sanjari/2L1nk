<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d0d12, #1a1a2e);
            color: white;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        h1 { font-size: 5rem; color: #8b5cf6; margin: 0; }
        p  { opacity: 0.6; margin: 1rem 0 2rem; }
        a  { color: #8b5cf6; text-decoration: none; border: 1px solid #8b5cf6; padding: 10px 24px; border-radius: 8px; }
        a:hover { background: rgba(139, 92, 246, 0.12); }
    </style>
</head>
<body>
    <div>
        <h1>404</h1>
        <p>Page Not Found</p>
        <a href="/">Home</a>
    </div>
</body>
</html>
